name: ETCS case-study evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scenario:
    name: ${{ matrix.scenario }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - protected-baseline
          - missing-safety-code
          - missing-corruption-protection
          - unknown-data
          - combined-degradation

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements.txt
      - name: Fetch pinned ROBOT 1.9.10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar' -OutFile 'tools/robot.jar'
          $expected = '16A73C074F3DF359A7338A84B4E0788785FE06117F931BB9796E9619EA776105'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath 'tools/robot.jar').Hash
          if ($actual -ne $expected) { throw "ROBOT checksum mismatch: $actual" }
      - name: Verify generated scenario contract
        shell: pwsh
        run: python -m unittest tests.test_etcs_scenarios.EtcsScenarioContractTest -v
      - name: Run publishable scenario
        shell: pwsh
        run: |
          python -u scripts/orchestrator.py `
            cases/etcs/abox.ttl `
            cases/etcs/classification-provenance.ttl `
            cases/etcs/scenarios/${{ matrix.scenario }}/security-facts.ttl `
            cases/etcs/scenarios/${{ matrix.scenario }}/transmission-environment.ttl `
            cases/etcs/scenarios/${{ matrix.scenario }}/threat-controls.ttl `
            --run-id ${{ matrix.scenario }} `
            --output build/${{ matrix.scenario }}-result.ttl `
            --progress
      - name: Create readable evidence tables
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'build/${{ matrix.scenario }}-result.ttl') {
            python scripts/summarize_case_run.py `
              build/${{ matrix.scenario }}-result.ttl `
              --run-id ${{ matrix.scenario }} `
              --markdown-out build/${{ matrix.scenario }}-summary.md `
              --csv-out build/${{ matrix.scenario }}-evaluations.csv
          }
      - name: Upload retained scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etcs-${{ matrix.scenario }}-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/${{ matrix.scenario }}-result.ttl
            build/${{ matrix.scenario }}-summary.md
            build/${{ matrix.scenario }}-evaluations.csv
