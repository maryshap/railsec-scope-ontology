name: ETCS case-study evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  data-audit:
    name: ETCS data readiness
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Create case-data readiness report
        shell: pwsh
        run: |
          python scripts/audit_etcs_case_data.py `
            --json-out build/etcs-case-data-audit.json `
            --markdown-out build/etcs-case-data-audit.md
      - name: Upload case-data readiness evidence
        uses: actions/upload-artifact@v6
        with:
          name: etcs-case-data-audit
          retention-days: 30
          path: |
            build/etcs-case-data-audit.json
            build/etcs-case-data-audit.md

  scenario:
    name: ${{ matrix.scenario }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - realistic-legacy
          - protected-baseline
          - missing-safety-code
          - missing-corruption-protection
          - unknown-data
          - combined-degradation
          - controlled-remote-attack-path

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r requirements.txt
      - name: Fetch pinned ROBOT 1.9.10
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          $uri = 'https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar'
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Remove-Item -LiteralPath 'tools/robot.jar' -Force -ErrorAction SilentlyContinue
              Invoke-WebRequest -Uri $uri -OutFile 'tools/robot.jar' -TimeoutSec 120
              break
            } catch {
              if ($attempt -eq 4) { throw }
              Write-Warning "ROBOT download attempt $attempt failed; retrying."
              Start-Sleep -Seconds (10 * $attempt)
            }
          }
          $expected = '16A73C074F3DF359A7338A84B4E0788785FE06117F931BB9796E9619EA776105'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath 'tools/robot.jar').Hash
          if ($actual -ne $expected) { throw "ROBOT checksum mismatch: $actual" }
      - name: Verify generated scenario contract
        shell: pwsh
        run: python -m unittest tests.test_etcs_scenarios.EtcsScenarioContractTest -v
      - name: Run publishable scenario
        shell: pwsh
        run: |
          $scenario = '${{ matrix.scenario }}'
          $inputs = @(
            'cases/etcs/abox.ttl'
            'cases/etcs/classification-provenance.ttl'
          )
          if ($scenario -eq 'realistic-legacy') {
            $inputs += @(
              'cases/etcs/security-facts.ttl'
              'cases/etcs/transmission-environment.ttl'
            )
          } else {
            $inputs += @(
              "cases/etcs/scenarios/$scenario/security-facts.ttl"
              "cases/etcs/scenarios/$scenario/transmission-environment.ttl"
              "cases/etcs/scenarios/$scenario/threat-controls.ttl"
            )
            $accessAssumptions = "cases/etcs/scenarios/$scenario/access-assumptions.ttl"
            if (Test-Path -LiteralPath $accessAssumptions) {
              $inputs += $accessAssumptions
            }
          }
          python -u scripts/orchestrator.py @inputs `
            --run-id $scenario `
            --output build/$scenario-result.ttl `
            --progress
      - name: Verify pre-registered controlled L3 result
        if: matrix.scenario == 'controlled-remote-attack-path'
        shell: pwsh
        run: |
          python scripts/verify_etcs_controlled_attack_path.py `
            build/controlled-remote-attack-path-result.ttl
      - name: Create readable evidence tables
        if: always()
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'build/${{ matrix.scenario }}-result.ttl') {
            python scripts/summarize_case_run.py `
              build/${{ matrix.scenario }}-result.ttl `
              --run-id ${{ matrix.scenario }} `
              --markdown-out build/${{ matrix.scenario }}-summary.md `
              --csv-out build/${{ matrix.scenario }}-evaluations.csv
          }
      - name: Upload retained scenario evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: etcs-${{ matrix.scenario }}-evidence
          if-no-files-found: warn
          retention-days: 30
          path: |
            build/${{ matrix.scenario }}-result.ttl
            build/${{ matrix.scenario }}-summary.md
            build/${{ matrix.scenario }}-evaluations.csv
